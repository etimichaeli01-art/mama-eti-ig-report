name: Fetch Instagram data

# Runs before the claude.ai weekly routine (trig_01JnKCjugVmUTwDuPLsdfC97, Sunday 04:00 UTC)
# fires, so the data is fresh when it reads latest_data.json from this repo.

on:
  schedule:
    - cron: '40 3 * * 0'  # Sunday 03:40 UTC, 20 min before the routine
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node fetch_report_data.mjs
        env:
          MAMA_ETI_USER_ID: ${{ secrets.MAMA_ETI_USER_ID }}
          MAMA_ETI_ACCESS_TOKEN: ${{ secrets.MAMA_ETI_ACCESS_TOKEN }}
